# LOCAL DATABASE (use this for now)
spring.datasource.url=jdbc:postgresql://localhost:5432/Skillroute
spring.datasource.username=postgres
spring.datasource.password=#Dnyana@25.Fe
spring.datasource.driver-class-name=org.postgresql.Driver
# ===================================
# JPA / HIBERNATE CONFIG
# ===================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ===================================
# GROQ API CONFIG
# ===================================
groq.api.key=
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=llama-3.1-8b-instant
groq.api.temperature=0.7
groq.api.max-tokens=2000

# ===================================
# CORS CONFIG
# ===================================
app.cors.allowed-origins=http://localhost:5173


# ===================================
# HIKARI CONNECTION POOL CONFIG
# ===================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000